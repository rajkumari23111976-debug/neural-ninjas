<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Neural Ninjas</title>  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">  <link rel="shortcut icon" href="https://github.com/rajkumari23111976-debug/neural-ninjas/blob/main/cybernetic-teen-engineer-stockcake.jpg" type="image/x-icon" /> <link rel="stylesheet" href="style.css?v=6">
</head><body>  <!-- LOGIN -->  <section id="loginScreen" class="screen">
    <div class="login-card">  <div class="logo">🥷</div>

  <h1>NEURAL NINJAS</h1>
  <p class="subtitle">Private Team Communication</p>

  <input
    id="usernameInput"
    type="text"
    maxlength="20"
    placeholder="Enter your username"
    autocomplete="off"
  >

  <button id="joinBtn">
    JOIN TEAM
  </button>

  <p id="loginStatus"></p>

</div>

  </section>  <!-- CHAT -->  <section id="chatScreen" class="screen hidden"><header class="chat-header">

  <div class="header-info">
    <h2>🥷 Neural Ninjas</h2>

    <span id="onlineStatus">
      Connecting...
    </span>
  </div>

  <div class="header-actions">

    <button
      id="menuBtn"
      class="icon-btn"
      title="Team members"
    >
      ⋮
    </button>

    <button
      id="logoutBtn"
      class="icon-btn"
      title="Exit chat"
    >
      ⎋
    </button>

  </div>

</header>


<!-- MEMBERS SIDEBAR -->
<aside id="membersSidebar" class="members-sidebar">

  <div class="sidebar-header">

    <div>
      <h3>Neural Ninjas</h3>
      <span id="memberCount">0 members</span>
    </div>

    <button
      id="closeSidebarBtn"
      class="close-sidebar"
    >
      ×
    </button>

  </div>

  <div id="membersList" class="members-list"></div>

</aside>

<div
  id="sidebarOverlay"
  class="sidebar-overlay"
></div>


<!-- MESSAGES -->
<main id="messages"></main>


<!-- COMPOSER -->
<footer class="composer">

  <button
    id="mediaBtn"
    class="tool-btn"
    title="Send image, video or audio"
  >
    ＋
  </button>

  <input
    id="messageInput"
    type="text"
    placeholder="Message Neural Ninjas..."
    autocomplete="off"
  >

  <button
    id="sendBtn"
    class="send-btn"
    title="Send message"
  >
    ➤
  </button>

</footer>


<input
  id="fileInput"
  type="file"
  accept="image/*,video/*,audio/*"
  hidden
>

  </section>  <!-- SUPABASE -->  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <!-- HIGHLIGHT.JS -->  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
  ></script>  <!-- APP -->  <script src="app.js"></script></body>
</html>
