<!DOCTYPE html>  <html lang="en">  <head>    <meta charset="UTF-8">  <meta
name="viewport"
content="width=device-width, initial-scale=1.0"

> 

  <title>Neural Ninjas</title>    <link  
    rel="stylesheet"  
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"  
  >    <link  
    rel="shortcut icon"  
    href="./cybernetic-teen-engineer-stockcake.jpg"  
    type="image/x-icon"  
  >    <link  
    rel="stylesheet"  
    href="style.css?v=8"  
  > 

  <link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="neural-ninjas-icon.png">
<meta name="theme-color" content="#050510">
</head>  <body>    <!-- LOGIN -->    <section  
    id="loginScreen"  
    class="screen"  
  >  <div class="login-card">  

  <div class="logo">🥷</div>  

  <h1>NEURAL NINJAS</h1>  

  <p class="subtitle">  
    Private Team Communication  
  </p>  

  <input  
    id="usernameInput"  
    type="text"  
    maxlength="20"  
    placeholder="Enter your username"  
    autocomplete="off"  
  >  

  <button id="joinBtn">  
    JOIN TEAM  
  </button>  

  <p id="loginStatus"></p>  

</div>

  </section>    <!-- CHAT -->    <section  
    id="chatScreen"  
    class="screen hidden"  
  >  <header class="chat-header">  

  <div class="header-info">  

    <h2>🥷 Neural Ninjas</h2>  

    <span id="onlineStatus">  
      Connecting...  
    </span>  

  </div>  

  <div class="header-actions">

  <!-- THEME -->
  <button
    id="themeBtn"
    class="icon-btn"
    title="Chat themes"
    type="button"
  >
    🎨
  </button>

  <!-- TEAM MEMBERS -->
  <button
    id="menuBtn"
    class="icon-btn"
    title="Team members"
    type="button"
  >
    ⋮
  </button>

  <!-- LOGOUT -->
  <button
    id="logoutBtn"
    class="icon-btn"
    title="Exit chat"
    type="button"
  >
    ⎋
  </button>

</div>


</header>  


<!-- MEMBERS SIDEBAR -->  

<aside  
  id="membersSidebar"  
  class="members-sidebar"  
>  

  <div class="sidebar-header">  

    <div>  

      <h3>Neural Ninjas</h3>  

      <span id="memberCount">  
        0 members  
      </span>  

    </div>  

    <button  
      id="closeSidebarBtn"  
      class="close-sidebar"  
    >  
      ×  
    </button>  

  </div>  

  <div  
    id="membersList"  
    class="members-list"  
  ></div>  

  <button  
    id="deleteAccountBtn"  
    class="delete-account-btn"  
  >  
    Delete Account  
  </button>  

</aside>  


<div  
  id="sidebarOverlay"  
  class="sidebar-overlay"  
></div>  

<!-- =========================
     CHAT THEME PANEL
     ========================= -->

<div id="themePanel" class="theme-panel hidden">

  <div class="theme-panel-header">

    <div>
      <h3>Chat Themes</h3>
      <span>Customize your chat</span>
    </div>

    <button
      id="closeThemeBtn"
      class="close-theme-btn"
      type="button"
      title="Close"
    >
      ×
    </button>

  </div>

  <div class="theme-options">

    <button
      class="theme-option"
      data-theme="default"
      type="button"
    >
      <span class="theme-preview default-preview"></span>
      <span>Neural Blue</span>
    </button>

    <button
      class="theme-option"
      data-theme="cyber"
      type="button"
    >
      <span class="theme-preview cyber-preview"></span>
      <span>Cyber Neon</span>
    </button>

    <button
      class="theme-option"
      data-theme="space"
      type="button"
    >
      <span class="theme-preview space-preview"></span>
      <span>Deep Space</span>
    </button>

    <button
      class="theme-option"
      data-theme="amber"
      type="button"
    >
      <span class="theme-preview amber-preview"></span>
      <span>Neon Amber</span>
    </button>

  </div>

</div>
<!-- MESSAGE SEARCH -->

<div id="searchBar" class="search-bar">  <input
id="messageSearchInput"
type="text"
placeholder="Search messages..."
autocomplete="off"

> 

<button
id="clearSearchBtn"
type="button"
title="Clear search"

> 

×

  </button>  </div>  <!-- MESSAGES -->  <main id="messages"></main>  <!-- TYPING INDICATOR -->  

<div  
  id="typingIndicator"  
  class="typing-indicator"  
></div>

<!-- REPLY BAR -->  <div  
  id="replyBar"  
  class="reply-bar hidden"  
>    <div class="reply-info">  <span class="reply-label">  
  Replying to  
</span>  

<strong id="replySender">  
  User  
</strong>  

<span  
  id="replyPreview"  
  class="reply-preview"  
></span>

  </div>  <button
id="cancelReplyBtn"
class="cancel-reply-btn"
type="button"
title="Cancel reply"

> 

×

  </button>  </div>  <!-- COMPOSER -->  

<footer class="composer">  

  <button  
    id="mediaBtn"  
    class="tool-btn"  
    title="Send image, video or audio"  
  >  
    ＋  
  </button>  

  <input  
    id="messageInput"  
    type="text"  
    placeholder="Message Neural Ninjas..."  
    autocomplete="off"  
  >  

  <button  
    id="sendBtn"  
    class="send-btn"  
    title="Send message"  
  >  
    ➤  
  </button>  

</footer>  


<!-- ATLAS FOOTER -->  

<div class="atlas-footer">  
  Made by Kshitij & Anand for ATLAS Discussion  
</div>  


<input  
  id="fileInput"  
  type="file"  
  accept="image/*,video/*,audio/*"  
  hidden  
>

  </section>    <!-- SUPABASE -->    <script  
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"  
  ></script>    <!-- HIGHLIGHT.JS -->    <script  
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"  
  ></script>    <!-- APP -->    <script src="app.js?v=8"></script> 
  
  </body>  </html>
